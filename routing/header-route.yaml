# Header-based routing: X-Canary: true sends to v2
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-based-route
  namespace: demo
spec:
  parentRefs:
    - name: platform-gateway
      sectionName: https
  hostnames: ["app.example.com"]
  rules:
    - matches:
        - headers:
            - name: X-Canary
              value: "true"
      backendRefs:
        - name: app-v2
          port: 80
    - backendRefs:
        - name: app-v1
          port: 80
