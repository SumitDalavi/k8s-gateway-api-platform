# 90/10 canary split: 90% traffic to v1 (stable), 10% to v2 (canary)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-split
  namespace: demo
spec:
  parentRefs:
    - name: platform-gateway
      sectionName: https
  hostnames: ["app.example.com"]
  rules:
    - backendRefs:
        - name: app-v1
          port: 80
          weight: 90
        - name: app-v2
          port: 80
          weight: 10
