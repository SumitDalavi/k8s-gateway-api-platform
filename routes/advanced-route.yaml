apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: advanced-route
  namespace: default
spec:
  parentRefs:
  - name: platform-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    backendRefs:
    - name: auth-svc
      namespace: services
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /payment
      headers:
      - name: x-canary
        value: "true"
    backendRefs:
    - name: payment-svc-canary
      namespace: services
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /payment
    backendRefs:
    - name: payment-svc
      namespace: services
      port: 8080
